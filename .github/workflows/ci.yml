name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version's pre-release suffix: .devN on main (N commits since the last release tag), none on
  # release tags (which must match pyproject.toml) or pull requests.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: |
          project=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' pyproject.toml)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml's version $project"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
              suffix=".dev$(git rev-list --count "$last..HEAD")"
            else
              suffix=".dev$(git rev-list --count HEAD)"
            fi
          fi
          {
            echo "version=$project$suffix"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "Version $project$suffix"

  # pre-commit: whitespace, ruff check + format, mypy; then actionlint on the workflows.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The offline suite on every platform; the oldest supported Python on the oldest Ubuntu.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: ubuntu-24.04-arm, python: "3.13" }
          - { os: macos-15, python: "3.13" }
          - { os: windows-2022, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # DuckDB's spatial extension (workspace tests): install once and fail rather than skip.
      - run: python -c "import duckdb; duckdb.sql('INSTALL spatial')"
      - run: python -m pytest -q
        env:
          LUNAR_REQUIRE_SPATIAL: "1"

  # Line and branch coverage of the package; GitHub Pages publishes the HTML report and the README
  # badge's endpoint (coverage/badge.json) from main (pages job).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import duckdb; duckdb.sql('INSTALL spatial')"
      - name: Test
        run: >
          python -m pytest -q --cov --cov-report=term --cov-report=html:coverage
          --cov-report=json:coverage.json --cov-report=markdown:coverage.md
      - name: Badge
        run: |
          python - <<'EOF'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = next(c for limit, c in [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
                                          (60, "yellow"), (50, "orange"), (0, "red")] if pct >= limit)
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open("coverage/badge.json", "w"))
          EOF
      - name: Summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The sdist and the one pure-Python wheel (py3-none-any, installs on every platform), checked
  # with twine and installed into a clean environment.
  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Version
        run: >
          sed -i -E 's/^version = "([0-9.]+)"$/version = "\1${{ needs.version.outputs.suffix }}"/'
          pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/python -c "import lunar_toolkit, importlib.metadata as m; print(m.version('lunar-toolkit'))"
          venv/bin/lunar --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The documentation (mkdocs --strict) for every push and pull request.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      # The static browser (lunar serve's page) and its bundled basemaps at /browser/; it opens local or hosted Parquet files.
      - run: mkdir -p site/browser && cp -r lunar_toolkit/static/index.html lunar_toolkit/static/basemaps site/browser/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 3

  # The documentation with the coverage report under coverage/ (and coverage/badge.json for the
  # README badge), on GitHub Pages from main. A failed coverage run leaves the report out.
  pages:
    needs: [docs, coverage]
    if: ${{ !cancelled() && needs.docs.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-report
          path: site/coverage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The wheel and sdist to PyPI by Trusted Publishing (no stored token): X.Y.Z.devN from main,
  # X.Y.Z from release tags, once lint, every test and the build pass.
  pypi:
    needs: [lint, test, build]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lunar-toolkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # A GitHub release for each v* tag, with the wheel, the sdist and their checksums.
  release:
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "Lunar Toolkit ${GITHUB_REF_NAME#v}" --generate-notes
